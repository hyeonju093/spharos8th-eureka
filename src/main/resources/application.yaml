server:
  port: 8761

spring:
  application:
    name: eureka

eureka:
  dashboard:
    enabled: true
    path: /
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  server:
    enable-self-preservation: false
    wait-time-in-ms-when-sync-empty: 0
